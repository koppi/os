set default=0
set timeout=1
set pager=1

set color_normal=white/black
set color_highlight=green/black

# Take whatever mode the firmware GOP / VBE is already in and keep it across the
# hand-off. A laptop panel (the ThinkPad X250 is 1366x768, the T470s is
# 1920x1080 or 2560x1440) does not offer a fixed 1280x1024; the kernel reads the
# real width/height/pitch from the multiboot framebuffer tag.
insmod all_video
insmod gfxterm
# Prefer a 32-bpp mode (UEFI GOP is always 32-bpp; the kernel's text renderer
# assumes 4 bytes/pixel). Fall back to the current mode if none is offered.
set gfxmode=1920x1080x32,2560x1440x32,1600x900x32,1366x768x32,1280x800x32,1280x720x32,1024x768x32,auto
set gfxpayload=keep
terminal_output gfxterm

loadfont /boot/grub/fonts/unicode.pf2

# Real-hardware escape hatches: append any of these words to the `multiboot2`
# line (press 'e' at the menu) to skip a driver that misbehaves --
#   noxhci  nousb  noahci  nonvme  nonet  nosmp  nofb  nosyn  novirtiogpu
menuentry "os" {
    multiboot2 /boot/kernel.elf
    module2 /boot/initrd.img initrd
}

menuentry "os (safe: no xHCI / AHCI / NVMe / SMP)" {
    multiboot2 /boot/kernel.elf noxhci noahci nonvme nosmp
    module2 /boot/initrd.img initrd
}

menuentry "os (text console -- no framebuffer)" {
    set gfxpayload=text
    terminal_output console
    multiboot2 /boot/kernel.elf nofb
    module2 /boot/initrd.img initrd
}

menuentry "os (multiboot 1)" {
    multiboot /boot/kernel.elf
    module /boot/initrd.img initrd
}
