set default=0
set timeout=1
set pager=1

set color_normal=white/black
set color_highlight=green/black

# Take whatever mode the firmware GOP / VBE is already in and keep it across the
# hand-off. A laptop panel (the ThinkPad X250 is 1366x768, the T470s is
# 1920x1080 or 2560x1440) does not offer a fixed 1280x1024; the kernel reads the
# real width/height/pitch from the multiboot framebuffer tag.
insmod all_video
insmod gfxterm
# `auto` first: keep the mode the firmware GOP already set (the panel's native
# resolution) without asking GRUB to switch -- a failed SetMode on a real
# laptop's GOP could leave the payload with no linear framebuffer at all, and
# under pure UEFI there is no VGA text fallback (black screen). The explicit
# 32-bpp modes after it are only a Legacy/CSM fallback, where GRUB starts in
# text mode and `auto` yields no graphics.
set gfxmode=auto,1366x768x32,1280x800x32,1280x720x32,1024x768x32
set gfxpayload=keep
terminal_output gfxterm

loadfont /boot/grub/fonts/unicode.pf2

# Real-hardware escape hatches: append any of these words to the `multiboot2`
# line (press 'e' at the menu) to skip a driver that misbehaves --
#   noxhci  noehci  nousb  noahci  nonvme  nonet  nosmp  nofb  nosyn  novirtiogpu
menuentry "os" {
    multiboot2 /boot/kernel.elf
    module2 /boot/initrd.img initrd
}

menuentry "os (safe: no xHCI / AHCI / NVMe / SMP)" {
    multiboot2 /boot/kernel.elf noxhci noahci nonvme nosmp
    module2 /boot/initrd.img initrd
}

# If "os" comes up to a black screen on a real laptop, try this: it pins a
# small, universally-supported 32-bpp linear mode instead of keeping the
# panel's native (large) resolution.
menuentry "os (force 1024x768)" {
    set gfxmode=1024x768x32
    set gfxpayload=1024x768x32
    terminal_output gfxterm
    multiboot2 /boot/kernel.elf
    module2 /boot/initrd.img initrd
}

# Legacy/CSM only -- under pure UEFI there is no VGA text mode, so this is
# itself a black screen there.
menuentry "os (text console -- no framebuffer, CSM only)" {
    set gfxpayload=text
    terminal_output console
    multiboot2 /boot/kernel.elf nofb
    module2 /boot/initrd.img initrd
}

menuentry "os (multiboot 1)" {
    multiboot /boot/kernel.elf
    module /boot/initrd.img initrd
}
