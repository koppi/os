# The early configuration baked into GRUB on an *installed* disk (core.img for
# BIOS, BOOTX64.EFI for UEFI; built by scripts/payload.sh, put there by apps/install).
#
# GRUB comes up knowing only which disk the firmware started it from, and on a
# GPT disk with a BIOS boot partition that is the whole disk, not the system
# volume. So find the volume by the marker file the installer writes into it,
# then carry on as usual: `normal` reads /boot/grub/grub.cfg from there.
#
# A marker rather than a device name (hd0,gpt2), because the installer cannot
# know what the firmware will call this disk next time: another disk or a USB
# stick changes the numbering. The marker exists only on volumes the installer
# made, so the installer's own medium (the ISO) is never mistaken for the system.
#
# Plain commands, one per line: this runs before `normal` and is read by GRUB's
# rescue parser, which has no `if` -- a failed `search` leaves root and prefix as
# GRUB found them, which is the right thing on UEFI, where that is the ESP.
search --no-floppy --file --set=root /boot/grub/koppios.id
set prefix=($root)/boot/grub
normal
